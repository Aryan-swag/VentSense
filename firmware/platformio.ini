; VentSense controller firmware
;   pio test -e native        -> safety-core unit tests on the laptop
;   pio run  -e esp32dev_mock -> ESP32 build with simulated sensors (bare DevKitC, no rig)
;   pio run  -e esp32dev      -> ESP32 build for the real rig (drivers written; bring-up: BRINGUP.md)

[platformio]
default_envs = native

[env]
build_flags = -std=gnu++17 -Wall -Wextra
build_unflags = -std=gnu++11

[env:native]
platform = native
test_framework = unity
build_flags = ${env.build_flags} -Wno-missing-field-initializers

[esp32_common]
platform = espressif32
board = esp32dev            ; ESP32-DevKitC-32E (ESP32-WROOM-32E, 4 MB flash)
framework = arduino
monitor_speed = 115200
test_ignore = *
; 1.9 MB app slots (OTA-capable) + small LittleFS for the dashboard; the default 1.3 MB was 80 % full
board_build.partitions = min_spiffs.csv
extra_scripts = pre:tools/embed_web.py
lib_deps =
    adafruit/Adafruit ADS1X15@^2.5.0
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    adafruit/Adafruit INA219@^1.2.3
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/RTClib@^2.1.4
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9

[env:esp32dev_mock]
extends = esp32_common
build_flags = ${env.build_flags} -DVS_MOCK_SENSORS=1 -DVS_ADMIN_PASS=\"ventsense-admin\"

[env:esp32dev]
extends = esp32_common
build_flags = ${env.build_flags} -DVS_MOCK_SENSORS=0 -DVS_ADMIN_PASS=\"ventsense-admin\"

; VentSense controller firmware
;   pio test -e native        -> safety-core unit tests on the laptop
;   pio run  -e esp32dev_mock -> ESP32 build with simulated sensors (bare DevKitC, no rig)
;   pio run  -e esp32dev      -> ESP32 build for the real rig (sensor drivers: TODO)

[platformio]
default_envs = native

[env]
build_flags = -std=gnu++17 -Wall -Wextra
build_unflags = -std=gnu++11

[env:native]
platform = native
test_framework = unity
build_flags = ${env.build_flags} -Wno-missing-field-initializers

[esp32_common]
platform = espressif32
board = esp32dev            ; ESP32-DevKitC-32E (ESP32-WROOM-32E, 4 MB flash)
framework = arduino
monitor_speed = 115200
test_ignore = *

[env:esp32dev_mock]
extends = esp32_common
build_flags = ${env.build_flags} -DVS_MOCK_SENSORS=1

[env:esp32dev]
extends = esp32_common
build_flags = ${env.build_flags} -DVS_MOCK_SENSORS=0
